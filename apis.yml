aid: ledge
name: Ledge
description: >-
  Ledge is an AI-powered close management, reconciliation and payment-operations
  platform for finance teams. It centralizes transaction and payment data from a
  company's entire stack — banks, payment service providers, ERPs, billing
  systems, data warehouses and file feeds — and automates the work on top of it:
  multiway transaction matching, account and payment reconciliation, automated
  cash application, flux analysis, working papers, and journal entries posted
  back to the ERP with review and approval built in. Its Agent Studio lets teams
  build AI agents that execute close-checklist tasks, with human-in-the-loop
  review, rationale, and a queryable audit trail. Ledge exposes a REST API over
  its Sources and Transactions data, authorized with OAuth 2.0 client
  credentials. Founded in 2022, the company raised a $9M seed round led by NEA
  with participation from Vertex Ventures, FJ Labs and Picus Capital.
