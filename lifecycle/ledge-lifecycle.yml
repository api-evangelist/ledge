sla:
  url: https://www.ledge.co/support-policy
  published: true
  uptime_target: 99.9%
  measurement_period: monthly
  service_credits:
  - availability_band: 99.9% > availability > 99%
    credit: 5% of the platform monthly fee
  - availability_band: 99% > availability > 95%
    credit: 10% of the platform monthly fee
